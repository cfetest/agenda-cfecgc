# Regenere l'agenda 3 fois par jour (8h, 14h et 18h, heure de Paris) et le publie sur GitHub Pages.
name: Mise a jour de l'agenda

on:
  schedule:
    # Heures UTC. 8h/14h/18h a Paris = 7h/13h/17h UTC en hiver, 6h/12h/16h UTC en ete.
    # GitHub lance souvent ces taches avec 30 a 60 min de retard (ou en saute) : on declenche
    # a l'heure prevue et aux deux heures suivantes, et le job "horaire" ne fait la mise a jour
    # que si le dernier creneau (8h, 14h ou 18h) n'a pas encore ete traite.
    - cron: "7 6,7,8,9,12,13,14,15,16,17,18,19 * * *"
  workflow_dispatch:         # bouton "Run workflow" pour lancer a la main
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  horaire:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        name: Verifier si un creneau (8h, 14h, 18h Paris) reste a traiter
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          now=$(date +%s); slot=0
          for d in "$(TZ=Europe/Paris date -d yesterday +%F)" "$(TZ=Europe/Paris date +%F)"; do
            for h in 08 14 18; do
              t=$(TZ=Europe/Paris date -d "$d $h:00" +%s)
              if [ "$t" -le "$now" ] && [ "$t" -gt "$slot" ]; then slot=$t; fi
            done
          done
          # Heure (UTC, secondes) de la derniere publication, ecrite dans stamp.txt par le job build.
          last=$(curl -fsL "https://cfetest.github.io/agenda-cfecgc/stamp.txt?x=$now" | tr -dc 0-9)
          last=${last:-0}
          echo "Dernier creneau : $(TZ=Europe/Paris date -d @$slot '+%d/%m %Hh%M') ; derniere publication : $(TZ=Europe/Paris date -d @$last '+%d/%m %Hh%M')"
          if [ "$last" -lt "$slot" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "Deja a jour : rien a faire"; fi

  build:
    needs: horaire
    if: needs.horaire.outputs.run == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Recuperer les evenements et generer la page
        shell: powershell
        run: |
          # Rendez-vous du site + ajouts.json (communications email a venir), s il existe
          powershell -NoProfile -ExecutionPolicy Bypass -File .\fetch-agenda.ps1
          $code = $LASTEXITCODE
          Get-Content .\fetch.log -ErrorAction SilentlyContinue
          if ($code -ne 0) { exit $code }

      - name: Preparer le site
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force _site | Out-Null
          Copy-Item index.html, style.css, app.js, travaux.svg _site\
          # Heure de publication (UTC, secondes), lue par le job "horaire" au passage suivant.
          [IO.File]::WriteAllText("_site\stamp.txt", [string][DateTimeOffset]::UtcNow.ToUnixTimeSeconds())

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
